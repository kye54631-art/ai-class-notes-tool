<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑笔记 - AI课堂笔记整理工具</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .editor-toolbar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 1rem;
        }
        .note-title-input {
            font-size: 1.5rem;
            font-weight: 700;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 0.5rem 0;
            width: 100%;
            margin-bottom: 1rem;
            background: transparent;
        }
        .note-title-input:focus {
            outline: none;
            border-bottom-color: var(--primary);
        }
        .note-title-input:hover { border-bottom-color: var(--border); }

        .ai-instruction-bar {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            padding: 0.75rem;
            background: var(--bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        .ai-instruction-bar input {
            flex: 1;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <span class="icon">📝</span>
            <span>AI课堂笔记</span>
        </a>
        <ul class="navbar-nav">
            <li><a href="/">🏠 首页</a></li>
            <li><a href="/history">📚 历史笔记</a></li>
            <li><a href="/settings">⚙️ 设置</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="page-header" style="display:flex; justify-content: space-between; align-items: center;">
            <div>
                <h1>✏️ 笔记编辑器</h1>
                <p>编辑、优化您的课堂笔记</p>
            </div>
            <div class="btn-group">
                <button class="btn btn-outline btn-sm" onclick="togglePreview()">👁️ 切换预览</button>
                <button class="btn btn-primary" onclick="saveNote()">💾 保存笔记</button>
                <select id="exportFormat" class="form-control" style="width:auto; display:inline;">
                    <option value="word">导出Word</option>
                    <option value="txt">导出TXT</option>
                    <option value="pdf">导出PDF</option>
                </select>
                <button class="btn btn-success" onclick="exportNote()">📥 导出</button>
            </div>
        </div>

        <input type="text" class="note-title-input" id="noteTitle" placeholder="输入笔记标题..." value="未命名笔记">

        <div class="editor-layout" id="editorLayout">
            <!-- 编辑面板 -->
            <div class="editor-panel" id="editPanel">
                <div class="panel-header">
                    <span class="panel-title">📝 Markdown 编辑</span>
                </div>
                <textarea class="editor-textarea" id="editorContent" placeholder="在此编辑笔记内容（支持Markdown格式）..."></textarea>
                <div class="ai-instruction-bar">
                    <span style="white-space:nowrap; font-weight:500;">🤖 AI继续处理：</span>
                    <input type="text" class="form-control" id="aiInstruction" placeholder="例如：请对这笔记补充更多细节、翻译成英文...">
                    <button class="btn btn-primary btn-sm" onclick="continueAI()" style="white-space:nowrap;">发送</button>
                </div>
            </div>

            <!-- 预览面板 -->
            <div class="editor-panel" id="previewPanel">
                <div class="panel-header">
                    <span class="panel-title">👁️ 预览</span>
                </div>
                <div class="preview-content" id="previewContent">
                    <p style="color: var(--text-muted); text-align: center; padding-top: 3rem;">
                        开始编辑，此处将显示预览效果
                    </p>
                </div>
            </div>
        </div>

        <!-- 加载状态 -->
        <div id="loadingIndicator" style="display:none; text-align:center; padding: 1rem;">
            <span class="spinner"></span>
            <span style="color: var(--text-secondary);"> AI正在处理中...</span>
        </div>

        <!-- 消息区 -->
        <div id="messageArea"></div>
    </div>

    <script src="/static/js/editor.js"></script>
</body>
</html>
